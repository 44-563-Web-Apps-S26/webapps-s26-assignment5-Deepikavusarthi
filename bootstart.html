<!DOCTYPE html>
<html lang="en">
<head>
  <title>Tree Image Gallery</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Large images (400–500px and square) */
    .tree-large {
      width: 450px;
      height: 450px;
      object-fit: cover; /* clips image to square */
      border-radius: 10px;
      border: 2px solid #ddd;
    }

    /* Thumbnails */
    .tree-thumb {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #bbb;
    }
  </style>
</head>

<body class="container mt-4">

  <h1 class="text-center mb-4">Tree Gallery</h1>

  <!-- First div container: Large Responsive Images -->
  <div class="d-flex flex-wrap justify-content-center gap-3 mb-5">
    <img src="oak.jpg" alt="Oak Tree" class="tree-large img-fluid">
    <img src="maple.jpg" alt="Maple Tree" class="tree-large img-fluid">
    <img src="pine.jpg" alt="Pine Tree" class="tree-large img-fluid">
  </div>

  <h2 class="text-center mb-3">Thumbnails</h2>

  <!-- Second div container: Thumbnails -->
  <div class="d-flex flex-wrap justify-content-center gap-3">
    <img src="oak.jpg" alt="Oak Thumbnail" class="tree-thumb">
    <img src="maple.jpg" alt="Maple Thumbnail" class="tree-thumb">
    <img src="pine.jpg" alt="Pine Thumbnail" class="tree-thumb">
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
